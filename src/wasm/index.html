<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <!-- Mobile: lock the page to the device and let the canvas run under
         system bars; zooming/scrolling is disabled so touch goes straight
         to the game. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>RepGame</title>
    <link rel="stylesheet" type="text/css" href="reset.css" />
    <link rel="stylesheet" type="text/css" href="index.css" />
  </head>
  <body>
    <div id="canvas_holder">
      <div id="startup">
        <button id="play_button" type="button">Click to play RepGame</button>
        <div id="gpu_status">Checking for WebGPU…</div>
        <div id="browser_status"></div>
        <div id="clear_area">
          <button id="clear_button" type="button">Clear saved world</button>
          <div id="clear_status"></div>
        </div>
      </div>
      <div id="download">
        Download RepGame for <a href="./RepGame">Linux </a> (or <a href="./RepGame-1-x86_64.AppImage">AppImage</a>), <a href="./RepGame.exe">Windows</a>, <a href="./RepGame.apk">Android</a> or preview here on the Web.
      </div>
      <canvas id="canvas"></canvas>
      <!-- Focus target for the mobile soft keyboard (index.js
           setup_soft_keyboard). Invisible but not display:none — it must
           stay focusable. -->
      <input id="soft_keyboard" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true">
    </div>
    <script src="index.js"></script>
  </body>
</html>
