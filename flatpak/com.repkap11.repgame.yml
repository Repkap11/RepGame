app-id: com.repkap11.repgame
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: RepGame
build-options:
  # RepGame's link rules take libs from LIBS_LINUX only; this makes the module
  # libs (GLEW under /app/lib) visible to ld via LDFLAGS.
  ldflags: -L/app/lib
finish-args:
  # https://docs.flatpak.org/en/latest/sandbox-permissions-reference.html
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Wayland access
  - --socket=wayland
  # OpenGL
  - --device=dri
  # GPU compute for terrain/mesh gen: ROCm needs /dev/kfd and CUDA needs
  # /dev/nvidia* — neither is covered by --device=dri. Supersedes dri.
  - --device=all
  # Needs to talk to the network:
  - --share=network
modules:
    # SDL3 comes from the runtime: freedesktop >=25.08 ships libSDL3.so.0 and
    # the matching Sdk ships headers + sdl3.pc, satisfying -lSDL3 in
    # LIBS_LINUX (makefiles/linux.mk).
    - shared-modules/glew/glew.json
    - name: RepGame
      buildsystem: simple
      build-commands:
      # The dir source above copies the host's out/ tree into the sandbox,
      # which would let make skip the compile and ship the host binary (built
      # against host libs like libamdhip64 that the runtime lacks). Wipe it
      # so the binary is always compiled inside the sandbox.
      - rm -rf out
      # The sandbox has no hipcc/nvcc, so GPU objects are precompiled in the
      # Docker image by `make gpu-prebuilt` (a prerequisite of `make flatpak`)
      # into prebuilt/gpu. GPU_PREBUILT_DIR makes hip.mk/cuda.mk link them and
      # pull the bundled runtime libs (prebuilt/gpu/lib → /app/lib).
      # The freedesktop SDK ships gcc, not the host's clang/lld — override
      # CC_LINUX/CCLD_LINUX so the sandbox builds with g++ + the default ld.
      # SOUND_OGG_DIR points at the host-converted OGGs (make sounds-prebuilt)
      # because the sandbox has no ffmpeg; prebuilt/ survives the `rm -rf out`.
      - make out/linux/release/RepGame_uncompressed GPU_PREBUILT_DIR=prebuilt/gpu SOUND_OGG_DIR=prebuilt/sounds CC_LINUX=g++ CCLD_LINUX=
      - install -Dm755 out/linux/release/RepGame_uncompressed /app/bin/RepGame_uncompressed
      # Wrapper is the flatpak `command:` — like the AppImage's AppRun, it
      # adds the default `World1 repkap11.com` args so a bare `flatpak run`
      # connects to the public server instead of starting single-player.
      - install -Dm755 flatpak/RepGameRun /app/bin/RepGame
      # Install only the libs the freedesktop runtime lacks. The full set in
      # prebuilt/gpu/lib is also needed for -rpath-link at link time, but
      # bundling runtime-provided libs (libdrm_amdgpu, libelf, libzstd, libffi)
      # shadows the GL extension's Mesa-matched copies and breaks EGL init.
      - mkdir -p /app/lib
      - |
        for pat in 'libamdhip64.so*' 'libhsa-runtime64.so*' 'librocprofiler-register.so*' 'libamd_comgr.so*' 'libnuma.so*' 'libbsd.so*' 'libmd.so*' 'libcudart_static.a'; do
          cp -a prebuilt/gpu/lib/$pat /app/lib/ 2>/dev/null || echo "no match for $pat"
        done
      sources:
          - type: dir
            path: ..
